<html lang="zh-CN">
<head>

<title>给宝贝莹莹做的发财树</title>
<style>
:root{--cream:#fff9ef;--ink:#513a32;--muted:#92766b;--orange:#f39b45;--green:#5d9b63;--gold:#f6c85f;--pink:#f28e9d;--card:rgba(255,255,255,.74);--shadow:0 24px 70px rgba(123,83,46,.15)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 10%,#fff 0 16%,transparent 35%),linear-gradient(135deg,#fff9ef,#fff1dc 48%,#edf8e9);min-height:100vh}button{font:inherit;cursor:pointer;border:0;color:inherit}.page{max-width:1100px;margin:auto;padding:28px 18px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{letter-spacing:.16em;font-size:12px;color:#b48a5c;font-weight:700}.topbar h1{margin:5px 0 0;font-size:clamp(23px,4vw,34px);line-height:1.2}.actions{display:flex;gap:8px}.icon-btn,.ghost-btn{background:rgba(255,255,255,.7);border:1px solid rgba(150,105,65,.15);border-radius:999px;padding:10px 14px;box-shadow:0 8px 20px rgba(112,73,35,.06)}.icon-btn:hover,.ghost-btn:hover{transform:translateY(-2px);background:white}.hero{margin-top:30px;text-align:center}.hero h2{font-size:clamp(30px,7vw,64px);line-height:1.08;margin:0;background:linear-gradient(100deg,#ef8c35,#dc6b75 65%,#9c6a45);-webkit-background-clip:text;color:transparent}.hero p{margin:13px auto 0;color:var(--muted);font-size:16px}.today{display:inline-flex;margin-top:15px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.65);font-size:13px;color:#a87950}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:22px;margin-top:30px}.panel{background:var(--card);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.tree-panel{min-height:570px;position:relative;overflow:hidden;padding:28px;display:grid;place-items:center}.tree-panel:before,.tree-panel:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.55}.tree-panel:before{width:250px;height:250px;background:#fff1c3;top:-90px;right:-60px}.tree-panel:after{width:180px;height:180px;background:#e6f5df;bottom:-80px;left:-40px}.tree-stage{position:relative;width:min(100%,560px);height:470px}.glow{position:absolute;width:370px;height:120px;bottom:7px;left:50%;transform:translateX(-50%);background:rgba(255,204,107,.25);border-radius:50%;filter:blur(15px)}.trunk{position:absolute;width:90px;height:245px;left:50%;bottom:93px;transform:translateX(-50%);background:linear-gradient(90deg,#8b5636,#c6844e 48%,#865033);border-radius:50% 50% 20px 20px;box-shadow:inset 10px 0 #71432e;z-index:2}.trunk:before,.trunk:after{content:"";position:absolute;height:155px;width:22px;background:#8a5536;border-radius:50%;transform-origin:bottom}.trunk:before{left:-4px;top:-125px;transform:rotate(-40deg)}.trunk:after{right:-3px;top:-145px;transform:rotate(38deg)}.branch{position:absolute;height:18px;background:#855033;border-radius:20px;transform-origin:left center;z-index:1}.b1{width:170px;left:40%;bottom:285px;transform:rotate(-28deg)}.b2{width:155px;left:53%;bottom:300px;transform:rotate(33deg)}.b3{width:130px;left:41%;bottom:225px;transform:rotate(27deg)}.b4{width:120px;left:54%;bottom:215px;transform:rotate(-35deg)}.leaves{position:absolute;inset:30px 55px 180px;z-index:3}.leaf{position:absolute;width:72px;height:48px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#a8d77b,#4d9257);box-shadow:inset 8px 4px rgba(255,255,255,.2),0 8px 16px rgba(71,123,56,.16);animation:sway 4.2s ease-in-out infinite;transform:rotate(var(--r));}.leaf:after{content:"";position:absolute;width:46px;height:2px;background:rgba(38,102,48,.28);left:14px;top:25px;transform:rotate(-25deg)}.leaf:nth-child(1){left:13%;top:16%;--r:-22deg}.leaf:nth-child(2){left:35%;top:2%;--r:12deg;animation-delay:.4s}.leaf:nth-child(3){right:10%;top:15%;--r:28deg;animation-delay:.8s}.leaf:nth-child(4){left:4%;top:40%;--r:-40deg;animation-delay:1.1s}.leaf:nth-child(5){left:28%;top:35%;--r:14deg;animation-delay:1.6s}.leaf:nth-child(6){right:3%;top:43%;--r:40deg;animation-delay:2s}.leaf:nth-child(7){left:50%;top:25%;--r:-4deg;animation-delay:2.4s}.pot{position:absolute;z-index:4;bottom:24px;left:50%;transform:translateX(-50%);width:180px;height:100px;background:linear-gradient(90deg,#e88956,#f6ad6f,#d8794e);clip-path:polygon(8% 0,92% 0,78% 100%,22% 100%);display:grid;place-items:center;text-align:center;font-weight:800;color:#fff9e8;font-size:15px;padding:16px}.pot:before{content:"";position:absolute;top:-7px;width:200px;height:18px;border-radius:50%;background:#aa633d}.fruit{position:absolute;z-index:5;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:31px;filter:drop-shadow(0 8px 5px rgba(89,61,35,.18));transition:.25s;animation:float 4s ease-in-out infinite;user-select:none}.fruit:hover,.fruit:focus-visible{transform:scale(1.22) rotate(5deg);outline:3px solid rgba(243,155,69,.3)}.fruit.done{filter:grayscale(.15) drop-shadow(0 8px 5px rgba(89,61,35,.18))}.f-orange{left:24%;top:22%}.f-banana{right:19%;top:22%;animation-delay:.4s}.f-apple{left:10%;top:48%;animation-delay:.9s}.f-peach{left:39%;top:46%;animation-delay:1.2s}.f-persimmon{right:8%;top:47%;animation-delay:1.6s}.f-pomegranate{left:20%;top:67%;animation-delay:2s}.f-grape{right:29%;top:67%;animation-delay:2.4s}.f-coin{left:50%;top:8%;animation-delay:2.8s}.f-heart{right:39%;top:3%;animation-delay:3.1s}.progress-wrap{position:absolute;bottom:8px;left:28px;right:28px;display:flex;align-items:center;gap:10px;color:#946a4c;font-size:13px}.progress{height:10px;flex:1;background:#f7e3c8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#e9a14d,#f47f73);border-radius:inherit;transition:width .5s}.side{display:flex;flex-direction:column;gap:18px}.stat{padding:23px}.stat h3,.notes h3{margin:0 0 13px;font-size:18px}.stat-number{font-size:36px;font-weight:900;color:#e78042}.stat small{color:var(--muted)}.main-btn{width:100%;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,#f3a451,#e57963);color:#fff;font-weight:800;box-shadow:0 10px 20px rgba(224,126,73,.25);transition:.2s}.main-btn:hover{transform:translateY(-2px);box-shadow:0 14px 25px rgba(224,126,73,.32)}.stats-line{display:flex;gap:10px;margin-top:14px}.mini{flex:1;background:#fff8ed;border-radius:14px;padding:11px;text-align:center;color:#9b735b;font-size:12px}.mini strong{display:block;font-size:20px;color:#d98344}.notes{padding:23px;flex:1}.quote{background:#fff9f2;border-radius:16px;padding:15px;color:#8d6554;line-height:1.8;min-height:84px}.small-link{background:none;color:#d77b4e;font-size:13px;margin-top:10px;padding:0}.collection{margin-top:22px;padding:26px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.section-head h3{margin:0;font-size:21px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:15px}.saved{padding:15px;background:#fff9f0;border-radius:16px;color:#805c4c;position:relative}.saved button{position:absolute;right:8px;top:7px;background:none;color:#d88b6b}.empty{color:#a98978;font-size:14px;padding:16px 0}.modal{position:fixed;inset:0;background:rgba(61,37,25,.34);display:grid;place-items:center;padding:18px;z-index:20;opacity:0;pointer-events:none;transition:.25s}.modal.show{opacity:1;pointer-events:auto}.dialog{max-width:410px;width:100%;background:#fffaf3;border-radius:25px;padding:28px;text-align:center;box-shadow:0 25px 70px rgba(64,41,24,.25);transform:translateY(20px) scale(.96);transition:.25s}.modal.show .dialog{transform:none}.dialog .emoji{font-size:62px;display:block;margin-bottom:7px}.dialog h3{margin:0 0 8px;font-size:25px}.dialog p{color:#886757;line-height:1.8;margin:0 0 20px}.dialog-actions{display:flex;gap:9px}.dialog-actions>*{flex:1}.secondary{padding:12px 15px;border-radius:14px;background:#f7ead8}.toast{position:fixed;left:50%;bottom:23px;transform:translate(-50%,20px);background:#50382f;color:white;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;z-index:50;transition:.3s;box-shadow:0 10px 25px rgba(42,25,16,.25);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.particle{position:fixed;z-index:40;pointer-events:none;font-size:22px;animation:burst 900ms ease-out forwards}.leaf-fall{position:fixed;z-index:1;top:-40px;animation:fall 5s linear forwards;pointer-events:none}@keyframes sway{0%,100%{rotate:0deg}50%{rotate:4deg}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(180deg) scale(1.2)}}@keyframes fall{to{transform:translate(100px,110vh) rotate(560deg);opacity:0}}@media(max-width:760px){.page{padding-top:18px}.topbar{align-items:flex-start}.layout{grid-template-columns:1fr}.tree-panel{min-height:530px;padding:12px}.tree-stage{height:455px;transform:scale(.9);transform-origin:center}.actions{flex-direction:column}.hero{margin-top:24px}.collection{padding:21px}.progress-wrap{left:16px;right:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
<header class="topbar"><div><div class="eyebrow">A LITTLE DIGITAL GIFT · 2026</div><h1>给宝贝莹莹做的发财树</h1></div><div class="actions"><button class="icon-btn" id="soundBtn" aria-label="切换声音">🔈 声音</button><button class="icon-btn" id="shareBtn" aria-label="分享祝福">↗ 分享</button></div></header>
<section class="hero"><h2 id="title" tabindex="0">愿我的莹莹橙蕉不停，开心不止</h2><p>一棵可以浇水、结果、藏着小秘密的幸福树</p><div class="today" id="dateText"></div></section>
<section class="layout"><div class="panel tree-panel" id="treePanel"><div class="tree-stage" aria-label="互动发财树">
<div class="glow"></div><div class="trunk"></div><div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div><div class="leaves"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div>
<button class="fruit f-orange" data-id="orange" aria-label="橙子，点击查看秘密">🍊</button><button class="fruit f-banana" data-id="banana" aria-label="香蕉，点击查看秘密">🍌</button><button class="fruit f-apple" data-id="apple" aria-label="苹果，点击查看秘密">🍎</button><button class="fruit f-peach" data-id="peach" aria-label="桃子，点击查看秘密">🍑</button><button class="fruit f-persimmon" data-id="persimmon" aria-label="柿子，点击查看秘密">🟠</button><button class="fruit f-pomegranate" data-id="pomegranate" aria-label="石榴，点击查看秘密">🍅</button><button class="fruit f-grape" data-id="grape" aria-label="葡萄，点击查看秘密">🍇</button><button class="fruit f-coin" data-id="coin" aria-label="金币，点击查看秘密">🪙</button><button class="fruit f-heart" data-id="heart" aria-label="爱心，点击查看秘密">💖</button><div class="pot">我们的<br>发财树</div>
</div><div class="progress-wrap"><span>幸福值 <b id="progressText">0%</b></span><div class="progress"><span id="progressBar"></span></div></div></div>
<aside class="side"><div class="panel stat"><h3>今天也来照顾它吧 🌱</h3><div class="stat-number" id="happyNumber">0%</div><small>每一次点击，都是给未来浇水</small><button class="main-btn" id="waterBtn" style="margin-top:18px">💧 点击浇水</button><div class="stats-line"><div class="mini"><strong id="waterCount">0</strong>今日浇水</div><div class="mini"><strong id="fruitCount">0</strong>已发现果实</div></div></div><div class="panel notes"><h3>今日随机情话</h3><div class="quote" id="quote">点击下面的按钮，领取一颗今天的甜。</div><button class="small-link" id="quoteBtn">换一句情话 ↻</button></div></aside></section>
<section class="panel collection"><div class="section-head"><h3>我的情话收藏夹 💌</h3><button class="ghost-btn" id="resetBtn">重置这棵树</button></div><div class="cards" id="savedList"><div class="empty">点击树上的果实，收集属于我们的甜甜话。</div></div></section>
</main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><span class="emoji" id="modalEmoji">🍊</span><h3 id="modalTitle">标题</h3><p id="modalText"></p><div class="dialog-actions"><button class="secondary" id="closeModal">先收藏一下</button><button class="main-btn" id="saveBtn">♡ 收藏这句</button></div></div></div><div class="toast" id="toast"></div>
<script>
const CONFIG={nickname:'莹莹',myName:'你的名字',togetherDate:'2025-01-17',title:'愿我的莹莹橙蕉不停，开心不止',quotes:['我想和你一起，把普通的日子过得闪闪发光。','发财不发财不重要，重要的是发财的时候身边有你。','你是我每天都想重新确认一次的喜欢。','以后不管赚多少钱，都要记得给你买喜欢的东西。','和你在一起，连平凡的日子都有了果实。','希望我们把生活过成一棵结满惊喜的树。']};
const fruits={orange:{emoji:'🍊',title:'橙心橙意',text:'橙子代表我的橙心橙意：希望你每天都被好运包围。'},banana:{emoji:'🍌',title:'香蕉来财',text:'香蕉弯弯，幸福满满。愿你所有期待都有回响。'},apple:{emoji:'🍎',title:'平平安安',text:'这颗苹果送给你，希望你每天都平平安安。'},peach:{emoji:'🍑',title:'逃不过我的喜欢',text:'这颗桃子代表：你逃不出我的喜欢。'},persimmon:{emoji:'🟠',title:'事事如意',text:'愿你遇到的每一件事，都顺顺利利、事事如意。'},pomegranate:{emoji:'🍅',title:'红红火火',text:'石榴一样热烈，愿我们的日子一直红红火火。'},grape:{emoji:'🍇',title:'甜甜蜜蜜',text:'一颗一颗都是甜，愿我们一直甜甜蜜蜜。'},coin:{emoji:'🪙',title:'一起发财',text:'以后一起赚很多很多钱，然后把喜欢的东西都买回家。'},heart:{emoji:'💖',title:'隐藏情话',text:'发财树的秘密是：我最想一起分享未来的人，一直都是你。'}};
let state=JSON.parse(localStorage.getItem('moneyTreeState')||'null')||{happy:0,water:0,found:[],saved:[],pair:[],sound:false};let current=null, titleClicks=0;
const $=s=>document.querySelector(s);const save=()=>localStorage.setItem('moneyTreeState',JSON.stringify(state));
document.title='给宝贝莹莹做的发财树';
function render(){state.happy=Math.min(100,state.happy);$('#happyNumber').textContent=state.happy+'%';$('#progressText').textContent=state.happy+'%';$('#progressBar').style.width=state.happy+'%';$('#waterCount').textContent=state.water;$('#fruitCount').textContent=state.found.length;document.querySelectorAll('.fruit').forEach(b=>b.classList.toggle('done',state.found.includes(b.dataset.id)));let list=$('#savedList');list.innerHTML=state.saved.length?state.saved.map((q,i)=>`<div class="saved">“${q}”<button aria-label="删除情话" data-del="${i}">×</button></div>`).join(''):'<div class="empty">点击树上的果实，收集属于我们的甜甜话。</div>';list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.saved.splice(+b.dataset.del,1);save();render()})}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function particles(symbol='✨',n=14){for(let i=0;i<n;i++){let e=document.createElement('span');e.className='particle';e.textContent=symbol;e.style.left=(45+Math.random()*10)+'%';e.style.top=(35+Math.random()*20)+'%';e.style.setProperty('--x',(Math.random()*260-130)+'px');e.style.setProperty('--y',(Math.random()*240-150)+'px');document.body.append(e);setTimeout(()=>e.remove(),950)}}
function openFruit(id){current=id;let f=fruits[id];$('#modalEmoji').textContent=f.emoji;$('#modalTitle').textContent=f.title;$('#modalText').textContent=f.text;$('#saveBtn').textContent=state.saved.includes(f.text)?'✓ 已收藏':'♡ 收藏这句';$('#modal').classList.add('show');particles(id==='coin'?'🪙':'💛',8);if(!state.found.includes(id)){state.found.push(id);state.happy+=3;save();render()}if(['orange','banana'].includes(id)){state.pair=[...new Set([...state.pair,id])];if(state.pair.length===2){state.happy+=10;save();render();setTimeout(()=>{toast('🍊🍌 恭喜你们，成交！');particles('🎉',28)},250)}}}
document.querySelectorAll('.fruit').forEach(b=>b.onclick=()=>openFruit(b.dataset.id));$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});$('#saveBtn').onclick=()=>{let text=fruits[current].text;if(!state.saved.includes(text))state.saved.push(text);save();render();$('#saveBtn').textContent='✓ 已收藏';toast('已放进你们的情话收藏夹')};
$('#waterBtn').onclick=()=>{state.water++;state.happy+=2;save();render();particles('💧',10);toast(['浇一点爱，幸福多一点。','今天也要茁壮成长。','你负责可爱，我负责发财。','爱情树已补充能量。'][Math.floor(Math.random()*4)]);if(state.happy>=100){toast('🌟 我们的幸福树结果啦！');particles('💰',30)}};let long;$('#waterBtn').onmousedown=()=>long=setTimeout(()=>toast('长按解锁：我想把所有好运都分给你'),700);$('#waterBtn').onmouseup=()=>clearTimeout(long);$('#waterBtn').ontouchstart=()=>long=setTimeout(()=>toast('长按解锁：我想把所有好运都分给你'),700);$('#waterBtn').ontouchend=()=>clearTimeout(long);
$('#quoteBtn').onclick=()=>$('#quote').textContent=CONFIG.quotes[Math.floor(Math.random()*CONFIG.quotes.length)];$('#soundBtn').onclick=()=>{state.sound=!state.sound;save();$('#soundBtn').textContent=state.sound?'🔊 声音':'🔈 声音';toast(state.sound?'声音已打开':'声音已关闭')};$('#shareBtn').onclick=async()=>{let text=`给${CONFIG.nickname}：愿我的莹莹橙蕉不停，开心不止。`;try{if(navigator.share)await navigator.share({title:'给宝贝莹莹做的发财树',text});else{await navigator.clipboard.writeText(text);toast('祝福已复制')}}catch(e){}};$('#resetBtn').onclick=()=>{if(confirm('确定要重置这棵树吗？已收藏的情话也会清空。')){localStorage.removeItem('moneyTreeState');state={happy:0,water:0,found:[],saved:[],pair:[],sound:false};render();toast('树苗重新发芽啦')}};$('#title').onclick=()=>{titleClicks++;if(titleClicks===7){toast('🎁 恭喜解锁：终身 VIP 女朋友待遇');particles('💖',20)}};$('.pot').onclick=()=>toast('根基稳稳的，我们的感情也稳稳的');let trunkClicks=0;$('.trunk').onclick=()=>{trunkClicks++;if(trunkClicks===5)toast('树干也知道你很爱我')};$('#dateText').textContent=`从 ${CONFIG.togetherDate} 起，今天也在一起 ♡`;render();setInterval(()=>{if(Math.random()>.45){let e=document.createElement('span');e.className='leaf-fall';e.textContent='🍃';e.style.left=Math.random()*100+'vw';e.style.fontSize=12+Math.random()*12+'px';document.body.append(e);setTimeout(()=>e.remove(),5100)}},4200);
</script></body></html>
